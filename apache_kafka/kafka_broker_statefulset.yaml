apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka-broker
  namespace: default
spec:
  serviceName: "kafka-broker-service"
  replicas: 3
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app: kafka-broker

  template:
    metadata:
      labels:
        app: kafka-broker
    
    spec:
      initContainers:
        # Télécharger JMX Exporter
        - name: download-jmx
          image: busybox:1.35
          command:
            - sh
            - -c
            - |
              echo "Downloading JMX Exporter..."
              wget -O /jmx/jmx_prometheus_javaagent.jar \
                https://repo1.maven.org/maven2/io/prometheus/jmx/jmx_prometheus_javaagent/0.20.0/jmx_prometheus_javaagent-0.20.0.jar
              echo "JMX Exporter downloaded successfully"
              ls -lh /jmx/
          volumeMounts:
            - name: jmx-jar
              mountPath: /jmx
        
        # Init broker (config Kafka)
        - name: init-broker
          image: apache/kafka:3.8.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -ex
              
              CLUSTER_ID="laA2BR9-So-1wGxQEMI_EQ"
              
              # Extract ordinal from pod name
              ORDINAL=$(echo ${HOSTNAME} | awk -F- '{print $NF}')
              NODE_ID=$((ORDINAL + 3))
              
              echo "host = ${HOSTNAME}"
              echo "My ordinal is ${ORDINAL}, so NODE_ID=${NODE_ID}"
              
              THIS_DNS="${HOSTNAME}.kafka-broker-service"
              
              # Create broker config
              cat > /var/lib/kafka/data/mybroker.properties <<EOFCONFIG
              process.roles=broker
              node.id=${NODE_ID}
              
              listeners=INTERNAL://:19092
              listener.security.protocol.map=INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
              advertised.listeners=INTERNAL://${THIS_DNS}:19092
              
              inter.broker.listener.name=INTERNAL
              
              controller.listener.names=CONTROLLER
              controller.quorum.voters=0@kafka-controller-0.kafka-controller-service.default.svc.cluster.local:9093,1@kafka-controller-1.kafka-controller-service.default.svc.cluster.local:9093,2@kafka-controller-2.kafka-controller-service.default.svc.cluster.local:9093
              
              log.dirs=/var/lib/kafka/data
              
              num.partitions=3
              default.replication.factor=3
              offsets.topic.replication.factor=3
              transaction.state.log.replication.factor=3
              transaction.state.log.min.isr=2
              auto.create.topics.enable=true
              EOFCONFIG
              
              cat /var/lib/kafka/data/mybroker.properties
              
              # Format storage if needed
              if [ ! -f /var/lib/kafka/data/meta.properties ]; then
                echo "Formatting storage with CLUSTER_ID=${CLUSTER_ID} and NODE_ID=${NODE_ID}"
                /opt/kafka/bin/kafka-storage.sh format \
                  --cluster-id ${CLUSTER_ID} \
                  --config /var/lib/kafka/data/mybroker.properties \
                  --ignore-formatted
              else
                echo "meta.properties already exists, skip format"
              fi
              
              echo "Resulting meta.properties:"
              cat /var/lib/kafka/data/meta.properties || true
          
          volumeMounts:
            - name: broker-data
              mountPath: /var/lib/kafka/data

      containers:
        - name: broker
          image: apache/kafka:3.8.0
          imagePullPolicy: IfNotPresent
          
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              echo "Starting broker with JMX monitoring on port 7071"
              echo "Config file: /var/lib/kafka/data/mybroker.properties"
              
              exec /opt/kafka/bin/kafka-server-start.sh /var/lib/kafka/data/mybroker.properties
          
          ports:
            - containerPort: 19092
              name: internal
              protocol: TCP
            - containerPort: 7071
              name: jmx-metrics
              protocol: TCP
          
          volumeMounts:
            - name: broker-data
              mountPath: /var/lib/kafka/data
            - name: jmx-jar
              mountPath: /jmx
            - name: jmx-config
              mountPath: /etc/jmx-config
          
          env:
            - name: KAFKA_HEAP_OPTS
              value: "-Xmx512M -Xms512M"
            - name: KAFKA_OPTS
              value: "-javaagent:/jmx/jmx_prometheus_javaagent.jar=7071:/etc/jmx-config/kafka.yml"
          
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
      
      volumes:
        - name: jmx-jar
          emptyDir: {}
        - name: jmx-config
          configMap:
            name: jmx-kafka-config
  
  volumeClaimTemplates:
    - metadata:
        name: broker-data
        labels:
          app: kafka-broker
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi

---
apiVersion: v1
kind: Service
metadata:
  name: kafka-broker-service
  namespace: default
  labels:
    app: kafka-broker
spec:
  clusterIP: None
  selector:
    app: kafka-broker
  ports:
    - name: internal
      port: 19092
      targetPort: 19092
      protocol: TCP
    - name: jmx-metrics
      port: 7071
      targetPort: 7071
      protocol: TCP
