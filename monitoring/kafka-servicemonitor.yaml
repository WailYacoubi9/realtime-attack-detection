apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kafka-broker-metrics
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: kafka-broker
  namespaceSelector:
    matchNames:
      - default
  endpoints:
    - port: jmx-metrics
      interval: 30s
      scrapeTimeout: 10s
      path: /metrics
